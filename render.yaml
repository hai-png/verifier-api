services:
  - type: web
    # ONE service, one name.
    #
    # Two services were attached to this repo, both auto-deploying `selfhosted`,
    # so every push raced two builds: `verifier-api` (created 2026-09-30, inside
    # Project `verifier`, Live, carrying the real configuration) and
    # `verifier-api-selfhosted` (created 2026-10-02 by a Blueprint apply, never
    # configured, 19 deploys and 19 failures, never served a request). The
    # duplicate came from following DEPLOYMENT.md Step 3, which said to create a
    # service from this file without first checking whether one already existed.
    # That step now warns about it.
    #
    # If a service by this name already exists, do NOT apply this file — update
    # the existing service instead. A Blueprint apply creates a second service
    # rather than adopting the first.
    name: verifier-api
    env: docker
    plan: free  # 512MB RAM / shared CPU, spins down after 15 min inactivity (cold start ~30s)
    # TiDB is in Frankfurt (2026-09-26). Co-locate API + DB: a verification
    # spends two database round trips (access + quota) before the provider is even
    # called, and each transatlantic round trip measured ~300ms.
    #
    # This key only takes effect when a *new* service is created. Render cannot
    # move an existing service between regions and `render blueprints validate`
    # rejects a region change outright with "changing region not supported" — so
    # changing it here on a live service is a no-op at best. To relocate, create
    # the replacement in the target region and cut over. Do NOT recreate or
    # delete the database; see DEPLOYMENT.md.
    region: frankfurt
    # Explicit rather than implicit. Render's default is already `commit`, so this
    # documents the trigger instead of relying on it: a push to the connected
    # branch deploys. `checksPass` would gate on CI, which cannot verify that
    # *this* service has its own DATABASE_URL/ADMIN_SECRET/DASHBOARD_SECRET
    # populated — ci.yml boots with throwaway values, so a green run and a
    # service with no secrets are perfectly consistent.
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Probe the database, not the static metadata document. `/` answers 200 with
    # no dependency on anything, so a dead or scaled-to-zero database looked
    # healthy to Render and to any uptime check. `/ready` runs SELECT 1 and
    # returns 503 when the database is unreachable.
    healthCheckPath: /ready
    # The CBE legacy verifier needs a real Chromium binary. The previous
    # `env: node` service ignored Dockerfile entirely, so Render started the
    # app without Chromium and every Puppeteer fallback failed immediately.
    # Use the Docker image, which installs Chromium in the runtime layer.
    # Use db push instead of migrate deploy — the upstream migration history
    # has a bug (migration 4 ALTERs PlanPricingConfig but no migration CREATEs it).
    # db push reads schema.prisma directly and creates all tables, skipping the
    # broken migration files. Safe for fresh databases (which is what we have).
    #
    # Apply schema (idempotent — only creates missing tables/columns, preserves existing data)
    # No reset-db.js — we don't want to wipe data on every deploy.
    # Dockerfile CMD applies the Prisma schema and starts the API.
    envVars:
      - key: NODE_ENV
        value: production
      # Boot schema push (Dockerfile) after the first successful deploy, so cold
      # starts skip prisma db push entirely.
      - key: SKIP_SCHEMA_PUSH
        value: "false"
      - key: LOG_LEVEL
        value: info
      # Container disk is ephemeral and Render captures stdout: skip file logging.
      - key: LOG_TO_FILES
        value: "false"
      # Database (MySQL — TiDB Cloud Serverless free tier recommended)
      # Set this in the Render dashboard → Environment → Add DATABASE_URL
      - key: DATABASE_URL
        sync: false
      # Browser origins allowed to call this API. UNSET MEANS SAME-ORIGIN ONLY.
      #
      # The dashboard is a separate deploy on a different host from the API
      # (web/src/lib/api.ts calls https://verify.noveld.com.et from
      # dashboard.noveld.com.et), so it IS cross-origin and this MUST be set or
      # every dashboard request fails preflight. This replaces the previous
      # `origin: true`, which reflected any Origin and — combined with
      # CORS_CREDENTIALS and a session cookie accepted by requireSession —
      # exposed every dashboard route to any website.
      #
      # Trailing slashes are stripped when parsed, so pasting VERITAS_APP_URL
      # verbatim works.
      - key: CORS_ALLOWED_ORIGINS
        value: https://dashboard.noveld.com.et
      # Trust CF-Connecting-IP / X-Forwarded-For from a *public* peer. Off by
      # default: those headers are only trustworthy when the hop that set them is
      # one you deployed. On Render the peer is Render's proxy, so the default is
      # correct and per-IP rate limits key on the proxy address.
      - key: TRUST_FORWARDED_HEADERS
        value: "false"
      # What `expectedAmount` is compared against: net (what the recipient
      # actually received, after the provider's fee) or gross (what the payer was
      # charged). Net is the default and matches a bank statement. See
      # .env.example for the full explanation and a worked Telebirr example.
      - key: VERIFY_AMOUNT_BASIS
        value: net
      # Admin secret (generate with: openssl rand -hex 32)
      - key: ADMIN_SECRET
        sync: false
      #   Also grants unlimited credits per workspace:
      #     node scripts/grant-unlimited.mjs <workspace-id> [more ids...]
      #   Those are booleans on Workspace, not large credit balances, so they
      #   survive the monthly reset and a plan downgrade.
      - key: DASHBOARD_SECRET
        sync: false
      # Mistral AI (for /verify-image OCR)
      - key: MISTRAL_API_KEY
        sync: false
      # Telebirr proxy (your Plesk-hosted verify.php on proxy.noveld.com.et)
      # Comma-separated for failover: with one URL, hedging and failover are
      # inert and the Plesk box is a single point of failure for Telebirr.
      - key: FALLBACK_PROXIES
        sync: false
      - key: TELEBIRR_PROXY_KEY
        sync: false
      - key: SKIP_PRIMARY_VERIFICATION
        value: "true"
      # M-Pesa proxy (your Plesk-hosted mpesa.php on proxy.noveld.com.et)
      - key: MPESA_FALLBACK_URL
        sync: false
      - key: MPESA_PROXY_KEY
        sync: false
      # Dashboard URL — this is the WEB APP, not the API. Every link built from
      # it is a frontend route: /reset-password, /pl/<id>, /dashboard/billing.
      # Pointing it at the API made all three 401, because the auth router is
      # mounted at /auth and those paths fall through to apiKeyAuth.
      - key: VERITAS_APP_URL
        value: https://dashboard.noveld.com.et
      # Where the keep-alive pinger sends its request. RENDER_EXTERNAL_URL is
      # set by Render and on this service holds an onrender.com hostname that is
      # not routed here, so /ready 404ed every five minutes. This overrides it.
      - key: KEEP_ALIVE_URL
        value: https://verify.noveld.com.et
      # Redis (optional — only needed for webhook delivery, not for verifications)
      # If you want webhooks, get free Redis from Upstash and set this:
      - key: REDIS_URL
        sync: false
      # Status monitor (optional)
      - key: STATUS_MONITOR_SECRET
        sync: false
      # ── Performance knobs (optional, sane defaults) ──────────────────────────
      # Merge identical in-flight verifications and replay successful ones.
      # Set to 0 to disable.
      # - key: VERIFY_CACHE_TTL_MS
      #   value: "60000"
      # Batch the per-request usage log + API key counter writes.
      # - key: USAGE_LOG_FLUSH_MS
      #   value: "2000"
      # Cache the pricing row used by the rate limiter / quota gate.
      # - key: BILLING_CONFIG_CACHE_TTL_MS
      #   value: "30000"
      # Cap concurrent headless-Chromium work (legacy CBE).
      # - key: CBE_MAX_CONCURRENT_BROWSER_OPS
      #   value: "1"
