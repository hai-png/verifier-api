services:
  - type: web
    name: verifier-api-selfhosted
    env: node
    plan: free  # 512MB RAM, spins down after 15 min inactivity (cold start ~30s)
    # Use db push instead of migrate deploy — the upstream migration history
    # has a bug (migration 4 ALTERs PlanPricingConfig but no migration CREATEs it).
    # db push reads schema.prisma directly and creates all tables, skipping the
    # broken migration files. Safe for fresh databases (which is what we have).
    #
    # The pre-step (scripts/reset-db.js) clears the _prisma_migrations table
    # and any partial tables left by the prior failed deploy attempt.
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node scripts/reset-db.js && npx prisma db push --accept-data-loss && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Database (MySQL — TiDB Cloud Serverless free tier recommended)
      # Set this in the Render dashboard → Environment → Add DATABASE_URL
      - key: DATABASE_URL
        sync: false
      # Admin + dashboard secrets (generate with: openssl rand -hex 32)
      - key: ADMIN_SECRET
        sync: false
      - key: DASHBOARD_SECRET
        sync: false
      # Mistral AI (for /verify-image OCR)
      - key: MISTRAL_API_KEY
        sync: false
      # Telebirr proxy (your Plesk-hosted verify.php on proxy.noveld.com.et)
      - key: FALLBACK_PROXIES
        sync: false
      - key: TELEBIRR_PROXY_KEY
        sync: false
      - key: SKIP_PRIMARY_VERIFICATION
        value: "true"
      # M-Pesa proxy (your Plesk-hosted mpesa.php on proxy.noveld.com.et)
      - key: MPESA_FALLBACK_URL
        sync: false
      - key: MPESA_PROXY_KEY
        sync: false
      # App URL
      - key: VERITAS_APP_URL
        value: https://verify.noveld.com.et
      # Redis (optional — only needed for webhook delivery, not for verifications)
      # If you want webhooks, get free Redis from Upstash and set this:
      - key: REDIS_URL
        sync: false
      # Status monitor (optional)
      - key: STATUS_MONITOR_SECRET
        sync: false
