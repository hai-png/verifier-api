name: ci

# The production image had never been built by CI. render.yaml records that an
# earlier `env: node` service silently ignored the Dockerfile and ran without
# Chromium, and this job is what would catch that class of regression (plus the
# non-root USER and the /ready probe) before a deploy rather than after.
on:
  push:
    branches: [selfhosted]
  pull_request:
    branches: [selfhosted]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build the production image
        run: docker build -t verifier-api:ci .

      - name: Chromium is present in the runtime image
        run: docker run --rm --entrypoint /usr/bin/chromium verifier-api:ci --version

      - name: The runtime image does not run as root
        run: |
          uid="$(docker run --rm --entrypoint id verifier-api:ci -u)"
          if [ "$uid" = "0" ]; then echo "::error::image runs as root"; exit 1; fi
          echo "runtime uid=$uid"

      - name: The API boots and reports readiness
        run: |
          docker run -d --name verifier-api-ci \
            -e PORT=3001 -e NODE_ENV=production \
            -e ADMIN_SECRET=ci-admin-secret-0123456789abcdef \
            -e DASHBOARD_SECRET=ci-dashboard-secret-0123456789abcdef \
            -e SKIP_SCHEMA_PUSH=true -e KEEP_ALIVE_PINGER=false -e LOG_TO_FILES=false \
            -p 3001:3001 verifier-api:ci

          # /ready probes the database, so a boot without DATABASE_URL can never
          # pass this. Assert the cheaper liveness path and the boot sequence:
          # the container must stay up rather than crash-loop on a missing DB.
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:3001/health" >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::container never served /health"
            docker logs verifier-api-ci
            exit 1
          fi

          curl -fsS "http://127.0.0.1:3001/health" | tee /dev/stderr | grep -q '"status":"ok"'
          # Reachable but not ready: the database is intentionally absent here.
          code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3001/ready")"
          if [ "$code" = "200" ]; then
            echo "::error::/ready reported ready with no database configured"
            exit 1
          fi
          echo "health=200 ready=$code (expected non-200 without a database)"

      - name: Logs
        if: failure()
        run: docker logs verifier-api-ci || true

  # The dashboard had no CI coverage at all, which is how it came to ship a
  # hardcoded third-party API origin in six files: nothing ever built it, so
  # nothing ever had to say where it pointed.
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # web/ is its own npm project with its own lockfile; it is not part of the
      # pnpm workspace at the root (pnpm-workspace.yaml declares no packages).
      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: The API origin is configured, not defaulted to a third party
        working-directory: web
        run: |
          # NEXT_PUBLIC_* is inlined into the client bundle at build time, so this
          # is the last point at which anyone can notice where the dashboard will
          # send login credentials, bearer tokens and API keys.
          #
          # It used to fall back, in six files, to a Render host this repository
          # does not control. On the `selfhosted` branch that means a fork which
          # forgot the variable posted its users' credentials to a stranger.
          fail=0

          # 1. No file may pair the variable with a fallback value.
          if grep -rn "NEXT_PUBLIC_API_URL" src/ | grep -F '||'; then
            echo "::error::NEXT_PUBLIC_API_URL must not have a hardcoded fallback"
            fail=1
          fi

          # 2. No third-party origin anywhere in src/, outside explanatory comments.
          # The exclusion is anchored to `:<line>:` followed by a comment marker,
          # not to a bare `:` — the value being looked for is a URL, so a pattern
          # like `:(\*|//)` is satisfied by the `://` inside the offending line
          # itself and excludes exactly the line it exists to catch.
          leftover="$(grep -rn "onrender\.com" src/ | grep -vE ':[0-9]+:[[:space:]]*(\*|//)' || true)"
          if [ -n "$leftover" ]; then
            echo "::error::the dashboard must not hardcode a third-party API origin:"
            echo "$leftover"
            fail=1
          fi

          # 3. The single definition must still be the one place that reads it.
          if [ "$(grep -rl "NEXT_PUBLIC_API_URL" src/ | sort | tr '\n' ' ')" != "src/lib/config.ts " ]; then
            echo "::error::NEXT_PUBLIC_API_URL must be read only in src/lib/config.ts, found: $(grep -rl "NEXT_PUBLIC_API_URL" src/ | tr '\n' ' ')"
            fail=1
          fi

          # 4. The checked-in CSP must stay fail-closed. public/_headers is what
          #    gets deployed if scripts/write-headers.mjs is ever skipped, so it
          #    may not name any origin itself — and never a wildcard, which is how
          #    it came to authorise every subdomain of a third-party PaaS.
          if grep -nE "^\s*Content-Security-Policy:" public/_headers | grep -F "*"; then
            echo "::error::public/_headers CSP must not contain a wildcard origin"
            fail=1
          fi
          if ! grep -nE "^\s*Content-Security-Policy:" public/_headers | grep -qF "connect-src 'self';"; then
            echo "::error::public/_headers CSP connect-src must default to exactly 'self'"
            fail=1
          fi

          exit "$fail"

      - name: Build the static export
        working-directory: web
        # A throwaway origin: the assertion above is what guarantees a real build
        # pins its own, and an unset value here would only warn.
        run: NEXT_PUBLIC_API_URL=https://ci.invalid npm run build

      - name: The deployed CSP allows this build's origin and nobody else's
        working-directory: web
        run: |
          # out/_headers is the artifact that actually ships. write-headers.mjs
          # asserts its own post-conditions, so this only has to confirm the
          # substitution happened and that no origin other than the configured one
          # survived into the deployed file.
          header="$(grep -E "^[[:space:]]*Content-Security-Policy:" out/_headers)"
          if [ -z "$header" ]; then
            echo "::error::out/_headers has no Content-Security-Policy directive"
            exit 1
          fi
          if ! printf '%s' "$header" | grep -qF "connect-src 'self' https://ci.invalid;"; then
            echo "::error::connect-src was not pinned to the configured origin:"
            printf '%s\n' "$header"
            exit 1
          fi
          if printf '%s' "$header" | grep -F '*'; then
            echo "::error::deployed CSP contains a wildcard origin"
            exit 1
          fi
          if grep -rln "onrender\.com" out/; then
            echo "::error::the build output names a third-party host"
            exit 1
          fi
          echo "connect-src is pinned to the configured origin, with no wildcard."
