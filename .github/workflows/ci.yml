name: ci

# The production image had never been built by CI. render.yaml records that an
# earlier `env: node` service silently ignored the Dockerfile and ran without
# Chromium, and this job is what would catch that class of regression (plus the
# non-root USER and the /ready probe) before a deploy rather than after.
on:
  push:
    branches: [selfhosted]
  pull_request:
    branches: [selfhosted]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Activate the package manager before anything invokes it.
      #
      # `package.json` pins `packageManager: pnpm@11.0.0` and the Dockerfile
      # already does this (`corepack enable && corepack prepare pnpm@11.0.0
      # --activate`), but this workflow went straight from setup-node to
      # `pnpm install`. GitHub runners ship corepack without pnpm shims
      # activated, so the very first step died with:
      #
      #   /home/runner/work/_temp/<id>.sh: line 1: pnpm: command not found
      #   ##[error]Process completed with exit code 127.
      #
      # That is exit 127 in ~10 seconds, before typecheck, before tests and
      # before the image build — so this job has been reporting failure on every
      # commit since at least 2026-10-02 while verifying nothing whatsoever. A
      # red CI badge reads as "the change broke something"; it was actually
      # "nothing ran". Pin the same major the lockfile was written with, so a
      # silent drift cannot resolve differently from the Docker build.
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build the production image
        run: docker build -t verifier-api:ci .

      - name: Chromium is present in the runtime image
        run: docker run --rm --entrypoint /usr/bin/chromium verifier-api:ci --version

      - name: The runtime image does not run as root
        run: |
          uid="$(docker run --rm --entrypoint id verifier-api:ci -u)"
          if [ "$uid" = "0" ]; then echo "::error::image runs as root"; exit 1; fi
          echo "runtime uid=$uid"

      - name: The API boots and reports readiness
        run: |
          docker run -d --name verifier-api-ci \
            -e PORT=3001 -e NODE_ENV=production \
            -e ADMIN_SECRET=ci-admin-secret-0123456789abcdef \
            -e DASHBOARD_SECRET=ci-dashboard-secret-0123456789abcdef \
            -e SKIP_SCHEMA_PUSH=true -e KEEP_ALIVE_PINGER=false -e LOG_TO_FILES=false \
            -p 3001:3001 verifier-api:ci

          # /ready probes the database, so a boot without DATABASE_URL can never
          # pass this. Assert the cheaper liveness path and the boot sequence:
          # the container must stay up rather than crash-loop on a missing DB.
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:3001/health" >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::container never served /health"
            docker logs verifier-api-ci
            exit 1
          fi

          curl -fsS "http://127.0.0.1:3001/health" | tee /dev/stderr | grep -q '"status":"ok"'
          # Reachable but not ready: the database is intentionally absent here.
          code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3001/ready")"
          if [ "$code" = "200" ]; then
            echo "::error::/ready reported ready with no database configured"
            exit 1
          fi
          echo "health=200 ready=$code (expected non-200 without a database)"

      - name: Logs
        if: failure()
        run: docker logs verifier-api-ci || true
