name: Deploy Dashboard to Cloudflare Pages

# Static-exported Next.js dashboard in web/ → Cloudflare Pages.
# Triggers on pushes to selfhosted that touch the dashboard.
#
# Prerequisites (GitHub repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with "Cloudflare Pages:Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account ID
#
# After first deploy, Cloudflare gives you a *.pages.dev URL.
# Custom domain (dashboard.noveld.com.et):
#   1. Cloudflare Pages → project → Custom domains → Set up a custom domain
#   2. CNAME: dashboard.noveld.com.et → <project>.pages.dev
#
# The dashboard must match the API's VERITAS_APP_URL so password-reset
# email links land on a real page.

on:
  push:
    branches: [selfhosted]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  statuses: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build static export
        env:
          NEXT_PUBLIC_API_URL: https://verifier-api-selfhosted.onrender.com
        run: npx next build

      - name: Verify build output
        run: |
          if [ ! -d "out" ]; then
            echo "::error::Static export failed — 'out' directory not found"
            exit 1
          fi
          echo "✓ Static export ready: $(find out -type f | wc -l) files"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: noveld-pay-dashboard
          directory: web/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Dashboard deployed to Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Project:** noveld-pay-dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Custom domain:** https://dashboard.noveld.com.et (after CNAME setup)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
